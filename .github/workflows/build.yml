name: Build STM32 Firmware

on:
  push:
    branches: [ main, main-h5 ]
  pull_request:
    branches: [ main, main-h5 ]

jobs:
  build:
    name: Build STM32 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM GNU Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            ninja-build \
            cmake \
            python3

      - name: Verify Toolchain
        run: |
          arm-none-eabi-gcc --version
          cmake --version
          ninja --version

      - name: Generate ROS 2 message headers
        run: |
          python3 tools/msg2cdr.py --package can_msgs --msg transport_msgs/msg/Frame.msg \
            --out-dir br-stm32-h5e4vkt6/Core/Inc/generated/transport
          python3 tools/msg2cdr.py --package can_transport_msgs --msg transport_msgs/msg/FDFrame.msg \
            --out-dir br-stm32-h5e4vkt6/Core/Inc/generated/transport
          python3 tools/msg2cdr.py --package can_msgs --msg transport_msgs/msg/Frame.msg \
            --out-dir br-stm32-f767zi/Core/Inc/generated/transport
          python3 tools/msg2cdr.py --package can_transport_msgs --msg transport_msgs/msg/FDFrame.msg \
            --out-dir br-stm32-f767zi/Core/Inc/generated/transport

      - name: Build and Run Host Unit Tests
        run: |
          cmake -B tests/build -S tests -G Ninja \
            -DPROJECT_INC_DIR=${{ github.workspace }}/br-stm32-h5e4vkt6/Core/Inc
          cmake --build tests/build
          ctest --test-dir tests/build --output-on-failure

      - name: Build H5 Firmware
        run: |
          cmake -B br-stm32-h5e4vkt6/build -S br-stm32-h5e4vkt6 -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/br-stm32-h5e4vkt6/cmake/gcc-arm-none-eabi.cmake
          cmake --build br-stm32-h5e4vkt6/build --parallel
          arm-none-eabi-size br-stm32-h5e4vkt6/build/br-stm32-h5e4vkt6.elf

      - name: Build F7 Firmware
        run: |
          cmake -B br-stm32-f767zi/build -S br-stm32-f767zi -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/br-stm32-f767zi/cmake/gcc-arm-none-eabi.cmake
          cmake --build br-stm32-f767zi/build --parallel
          arm-none-eabi-size br-stm32-f767zi/build/br-stm32-f767zi.elf

      - name: Build G431 Encoder/BNO085 Firmware
        run: |
          cmake -B stm32-g431KBTx/stm32-g431KBTx_encoder_BNO085/build \
            -S stm32-g431KBTx/stm32-g431KBTx_encoder_BNO085 -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/stm32-g431KBTx/stm32-g431KBTx_encoder_BNO085/cmake/gcc-arm-none-eabi.cmake
          cmake --build stm32-g431KBTx/stm32-g431KBTx_encoder_BNO085/build --parallel
          arm-none-eabi-size \
            stm32-g431KBTx/stm32-g431KBTx_encoder_BNO085/build/stm32-g431KBTx_encoder_BNO085.elf

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware
          path: |
            br-stm32-h5e4vkt6/build/br-stm32-h5e4vkt6.elf
            br-stm32-h5e4vkt6/build/br-stm32-h5e4vkt6.bin
            br-stm32-h5e4vkt6/build/br-stm32-h5e4vkt6.map
            br-stm32-f767zi/build/br-stm32-f767zi.elf
            br-stm32-f767zi/build/br-stm32-f767zi.bin
            br-stm32-f767zi/build/br-stm32-f767zi.map
            stm32-g431KBTx/stm32-g431KBTx_encoder_BNO085/build/stm32-g431KBTx_encoder_BNO085.elf
            stm32-g431KBTx/stm32-g431KBTx_encoder_BNO085/build/stm32-g431KBTx_encoder_BNO085.bin
            stm32-g431KBTx/stm32-g431KBTx_encoder_BNO085/build/stm32-g431KBTx_encoder_BNO085.map
